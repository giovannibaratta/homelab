---
- name: Piraeus Node | Get active loop device for backing image
  ansible.builtin.command: "losetup -j {{ linstor_backing_file_path }}"
  register: losetup_out
  changed_when: false
  when: linstor_use_loopback
  become: true

- name: Piraeus Node | Set active storage device fact
  ansible.builtin.set_fact:
    active_linstor_device: "{{ (losetup_out.stdout.split(':')[0]) if linstor_use_loopback else linstor_raw_disk_device }}"

- name: Piraeus Node | Create Volume Group
  community.general.lvg:
    vg: "{{ linstor_volume_group }}"
    pvs: "{{ active_linstor_device }}"
  become: true

- name: Piraeus Node | Create Thin Pool within Volume Group
  community.general.lvol:
    vg: "{{ linstor_volume_group }}"
    lv: "{{ linstor_thin_pool }}"
    # We allocate 90% of the VG to the thin pool. The remaining 10% is left
    # unallocated, which is required by LVM for metadata allocation and snapshots.
    size: 90%VG
    opts: "--thinpool {{ linstor_thin_pool }}"
  become: true
