---
- name: Determine if host Zitadel is enabled
  ansible.builtin.set_fact:
    __idp_any_enabled: "{{ idp_docker_enabled | default(false) | bool }}"

- name: Deploy host Zitadel
  ansible.builtin.import_tasks: deploy_zitadel.yaml

- name: Undeploy host Zitadel
  ansible.builtin.import_tasks: undeploy_zitadel.yaml
