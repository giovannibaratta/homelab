- name: Determine enabled VPN components
  ansible.builtin.set_fact:
    __vpn_client_enabled: "{{ vpn_deploy_client | bool }}"
    __vpn_any_netbird_enabled: "{{ (vpn_deploy_dashboard | default(false) | bool) or (vpn_deploy_management_server | default(false) | bool) or (vpn_deploy_relay_server | default(false) | bool) or (vpn_deploy_stun_server | default(false) | bool) or (vpn_deploy_exit_node | default(false) | bool) or (vpn_deploy_jump_node | default(false) | bool) }}"

- name: Validate commercial VPN client settings
  ansible.builtin.import_tasks: validate_client.yaml
  when: __vpn_client_enabled | bool

- name: Deploy Netbird
  ansible.builtin.import_tasks: deploy_netbird.yaml

- name: Undeploy Netbird
  ansible.builtin.import_tasks: undeploy_netbird.yaml

- name: Deploy commercial VPN client
  ansible.builtin.import_tasks: deploy_client.yaml

- name: Undeploy commercial VPN client
  ansible.builtin.import_tasks: undeploy_client.yaml
