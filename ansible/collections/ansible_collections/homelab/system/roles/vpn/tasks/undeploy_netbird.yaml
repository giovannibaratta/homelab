---
- name: Discover services before Netbird cleanup
  ansible.builtin.service_facts:

- name: Ensure Netbird dashboard is stopped and disabled if not deployed
  when: not (vpn_deploy_dashboard | default(false) | bool)
  block:
    - name: Stop and disable Netbird dashboard
      ansible.builtin.systemd_service:
        name: netbird-dashboard
        state: stopped
        enabled: false
      when: >-
        'netbird-dashboard.service' in ansible_facts.services and
        ansible_facts.services['netbird-dashboard.service'].get('status', '') != 'not-found'

    - name: Remove Netbird dashboard Quadlet
      ansible.builtin.file:
        path: /etc/containers/systemd/netbird-dashboard.container
        state: absent
      register: __vpn_netbird_dashboard_removed

    - name: Reload systemd for Netbird dashboard
      when: __vpn_netbird_dashboard_removed.changed
      ansible.builtin.systemd_service:
        daemon_reload: true

- name: Ensure Netbird signal and mgmt are stopped and disabled if not deployed
  when: not (vpn_deploy_management_server | default(false) | bool)
  block:
    - name: Stop and disable Netbird signal and mgmt
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - netbird-signal
        - netbird-mgmt
      when: (item ~ '.service') in ansible_facts.services and ansible_facts.services[item ~ '.service'].get('status', '') != 'not-found'

    - name: Remove Netbird signal and mgmt Quadlets
      ansible.builtin.file:
        path: "/etc/containers/systemd/{{ item }}.container"
        state: absent
      loop:
        - netbird-signal
        - netbird-mgmt
      register: __vpn_netbird_mgmt_sig_removed

    - name: Reload systemd for Netbird signal and mgmt
      when: __vpn_netbird_mgmt_sig_removed.changed
      ansible.builtin.systemd_service:
        daemon_reload: true

