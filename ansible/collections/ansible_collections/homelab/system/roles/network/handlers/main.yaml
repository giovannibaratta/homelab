---
- name: Restart NetworkManager service
  ansible.builtin.service:
    name: NetworkManager
    state: restarted

- name: Restart DHCP service
  ansible.builtin.service:
    name: isc-dhcp-server
    state: restarted

- name: Reload systemd daemons for network role
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart ddclient network
  ansible.builtin.systemd_service:
    state: restarted
    name: ddclient-network

- name: Restart ddclient service
  # Unlike state=restarted, try-restart does not start an inactive backup's
  # updater. Keepalived decides which host should run the shared service.
  ansible.builtin.command:
    argv: [systemctl, try-restart, ddclient.service]
  changed_when: true

- name: Restart ddclient-node service
  ansible.builtin.systemd_service:
    state: restarted
    name: ddclient-node

- name: Restart keepalived
  ansible.builtin.service:
    name: keepalived
    state: restarted

- name: Restart ssh
  ansible.builtin.service:
    name: ssh
    state: restarted
