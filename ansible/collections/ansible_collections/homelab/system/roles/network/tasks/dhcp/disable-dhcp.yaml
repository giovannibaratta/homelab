- name: Network | Populate service facts
  ansible.builtin.service_facts:

- name: Network | Disable installed DHCP services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop:
    - isc-dhcp-server.service
    - isc-dhcp-server6.service
  when: item in ansible_facts.services and ansible_facts.services[item].get('status', '') != 'not-found'
