---
- name: Install apt key
  ansible.builtin.apt_key:
    keyring: /etc/apt/trusted.gpg.d/home_alvistack.gpg
    url: http://downloadcontent.opensuse.org/repositories/home:/alvistack/xUbuntu_24.04/Release.key
    id: 789CFFDE0295B8A1F4E5690C4BECC97550D0B1FD
    state: present

- name: Add apt repository
  ansible.builtin.apt_repository:
    filename: home:alvistack
    repo: deb http://downloadcontent.opensuse.org/repositories/home:/alvistack/xUbuntu_24.04/ /
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

# uidmap is required by podman for non root user
- name: Install uidmap
  ansible.builtin.package:
    name: uidmap
    state: present

# passt is required to install Pasta used by podman for non root user
- name: Install Pasta
  ansible.builtin.package:
    name: passt
    state: present

# Alternative option to Pasta. It seems that there are a few issues with some release of pasta
# when working with rootless containers
- name: Install slirp4netns
  ansible.builtin.package:
    name: slirp4netns
    state: present

- name: Install the AMD64 Podman runtime
  vars:
    __podman_deb_version: "100:{{ __podman_version }}-1"
    __netavark_deb_version: "100:{{ __netavark_version }}-1"
  block:
    - name: Pin Podman and its networking packages
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/podman-pin
        mode: "0644"
        content: |
          Package: podman podman-docker
          Pin: version {{ __podman_deb_version }}
          Pin-Priority: 1000

          Package: podman-netavark podman-aardvark-dns
          Pin: version {{ __netavark_deb_version }}
          Pin-Priority: 1000

          Package: buildah
          Pin: version {{ __buildah_deb_version }}
          Pin-Priority: 1000

          Package: skopeo
          Pin: version {{ __skopeo_deb_version }}
          Pin-Priority: 1000

          Package: podman podman-docker podman-netavark podman-aardvark-dns buildah skopeo
          Pin: version *
          Pin-Priority: -1

    - name: Install Podman and its networking packages together
      ansible.builtin.apt:
        name:
          - "podman={{ __podman_deb_version }}"
          - "podman-docker={{ __podman_deb_version }}"
          - "podman-netavark={{ __netavark_deb_version }}"
          - "podman-aardvark-dns={{ __netavark_deb_version }}"
          - "buildah={{ __buildah_deb_version }}"
          - "skopeo={{ __skopeo_deb_version }}"
        state: present

    - name: Check the packaged Netavark files
      ansible.builtin.command: dpkg --verify podman-netavark
      register: __containers_netavark_verify
      changed_when: false
      when: not ansible_check_mode

    - name: Restore the packaged Netavark executable if its checksum differs
      ansible.builtin.command:
        argv:
          - apt-get
          - --assume-yes
          - --reinstall
          - install
          - "podman-netavark={{ __netavark_deb_version }}"
      when:
        - not ansible_check_mode
        - "'/usr/libexec/podman/netavark' in __containers_netavark_verify.stdout"

    - name: Verify the installed Podman and Netavark versions
      ansible.builtin.command:
        argv: "{{ item.command }}"
      loop:
        - command: [podman, --version]
          expected: "{{ __podman_version }}"
        - command: [/usr/libexec/podman/netavark, --version]
          expected: "{{ __netavark_version }}"
      register: __containers_runtime_version
      changed_when: false
      failed_when: >-
        __containers_runtime_version.rc != 0 or
        __containers_runtime_version.stdout.split() | last != item.expected
      when: not ansible_check_mode
