---
- name: Install the AMD64 container runtime
  ansible.builtin.import_tasks: install_amd64.yaml
  when: ansible_facts.architecture == 'x86_64'

- name: Install the ARM64 container runtime
  ansible.builtin.import_tasks: install_arm64.yaml
  when: ansible_facts.architecture == 'aarch64'

- name: Reject unsupported container architectures
  ansible.builtin.assert:
    that: ansible_facts.architecture in ['x86_64', 'aarch64']
    fail_msg: "Unsupported container architecture: {{ ansible_facts.architecture }}"

- name: Create /etc/containers/nodocker
  ansible.builtin.file:
    path: /etc/containers/nodocker
    state: touch
    mode: "0644"
    access_time: preserve
    modification_time: preserve

- name: Create directory {{ containers_storage_dir }}
  ansible.builtin.file:
    path: "{{ containers_storage_dir }}"
    state: directory
    mode: "0711"

- name: Create directory {{ containers_ephemeral_dir }}
  ansible.builtin.file:
    path: "{{ containers_ephemeral_dir }}"
    state: directory
    mode: "0711"

# Reference https://github.com/containers/podman/blob/main/vendor/github.com/containers/storage/storage.conf
- name: Create /etc/containers/storage.conf
  ansible.builtin.copy:
    dest: /etc/containers/storage.conf
    content: |
      [storage]
      driver = "overlay"

      # Primary Read/Write location of container storage
      graphroot = "{{ containers_storage_dir }}"

      # Temporary storage location
      runroot = "{{ containers_ephemeral_dir }}"
    mode: "0640"

- name: Ensure group containters exists
  ansible.builtin.group:
    name: containers
    state: present

- name: Ensure group containters exists
  ansible.builtin.group:
    name: docker
    state: present

- name: Ensure podman.socket.d exists
  ansible.builtin.file:
    path: /etc/systemd/system/podman.socket.d
    mode: "0740"
    state: directory

- name: Ensure Podman socket overrides are present
  ansible.builtin.copy:
    dest: /etc/systemd/system/podman.socket.d/socket-group.conf
    content: |
      [Socket]
      SocketGroup=containers
    mode: "0640"
  notify:
    - Reload systemd daemon
    - Restart podman.socket service

- name: Ensure podman.service.d exists
  ansible.builtin.file:
    path: /etc/systemd/system/podman.service.d
    mode: "0740"
    state: directory

- name: Set Podman log level to warn
  ansible.builtin.copy:
    content: |
      [Service]
      Environment=LOGGING="--log-level=warn"
    dest: /etc/systemd/system/podman.service.d/logging.conf
    mode: "0640"
  notify:
    - Reload systemd daemon
    - Restart podman service

- name: Ensure Docker socket is assigned to the right group
  ansible.builtin.copy:
    # override /usr/lib/tmpfiles.d/podman-docker.conf
    dest: /etc/tmpfiles.d/podman-docker.conf
    content: L+  %t/docker.sock   -    root    containers     -   %t/podman/podman.sock

- name: Set sysctl container flags
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/60-containers-tuning.conf
    state: present
    reload: true
  loop:
    # Increase the value to avoid hitting "too many open files" errors
    - { key: "fs.inotify.max_user_instances", value: "4096" }
    - { key: "fs.inotify.max_queued_events", value: "32768" }
    - { key: "fs.inotify.max_user_watches", value: "524288" }

- name: Deploy cleanup-failed-services.sh script
  ansible.builtin.template:
    src: cleanup-failed-services.sh.j2
    dest: /usr/local/bin/cleanup-failed-services.sh
    mode: "0755"

- name: Ensure cron job for cleanup-failed-services.sh exists
  ansible.builtin.cron:
    name: cleanup-failed-services
    job: /usr/local/bin/cleanup-failed-services.sh
    minute: "*/5"
    state: present
    user: root
