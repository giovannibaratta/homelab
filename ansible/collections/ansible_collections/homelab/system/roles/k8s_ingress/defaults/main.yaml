# Available versions https://github.com/traefik/traefik-helm-chart/releases
k8s_ingress_traefik_chart_version: "42.0.0"
# Pin the proxy image separately: chart 42.0.0 defaults to v3.7.14.
k8s_ingress_traefik_version: "v3.7.15"

# Cilium Network Policy for Traefik Ingress Controller
# Enables L3/L4 network isolation restricting access to K8s Traefik (port 8000/2222) to cluster nodes only.
k8s_ingress_enable_network_policy: true

# Audit Mode: Set to "true" to log unauthorized flows to Hubble without dropping packets.
# Set to "false" to actively enforce packet drops.
k8s_ingress_policy_audit_mode: false
