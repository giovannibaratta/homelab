---
- name: Validate Grafana backend selection
  ansible.builtin.assert:
    that:
      - grafana_deployment_type is defined
      - grafana_deployment_type in ['podman', 'k8s']
    fail_msg: Explicitly set grafana_deployment_type to podman or k8s in the calling playbook.

- name: Determine Grafana lifecycle targets
  ansible.builtin.set_fact:
    __grafana_podman_enabled: "{{ (deploy_grafana | default(false) | bool) and grafana_deployment_type == 'podman' }}"
    # Cluster desired state is shared: a disabled host must not remove Grafana
    # while another inventory host still enables the Kubernetes backend.
    __grafana_k8s_hosts: >-
      {%- set ns = namespace(hosts=[]) -%}
      {%- for host in groups['all'] -%}
      {%- if (hostvars[host].deploy_grafana | default(false) | bool)
            and grafana_deployment_type == 'k8s' -%}
      {%- set ns.hosts = ns.hosts + [host] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.hosts }}

- name: Deploy Grafana
  ansible.builtin.import_tasks: deploy_grafana.yaml

- name: Undeploy unwanted Grafana backends
  ansible.builtin.import_tasks: undeploy_grafana.yaml
