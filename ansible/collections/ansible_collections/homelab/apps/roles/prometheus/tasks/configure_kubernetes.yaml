---
# Inputs:
#   prometheus_kubernetes_monitoring_enabled: whether cluster scrapes are wanted
#   prometheus_kubernetes_credentials: optional {token, ca_cert} strings
#
# Decision table:
#   Requested?  Complete supplied pair?  Complete installed pair?  Result
#   no          any                      any                       disabled
#   yes         yes                      any                       install supplied pair
#   yes         no                       yes                       reuse installed pair
#   yes         no                       no                        defer cluster scrapes
#
# Never install half a supplied pair. Reusing existing files during an API outage
# keeps cluster alerts active; initial setup without Kubernetes must still work.

- name: Determine whether the caller supplied a complete credential snapshot
  ansible.builtin.set_fact:
    __prometheus_kubernetes_fresh_credentials: >-
      {{ __supplied_token is string and __supplied_token | length > 0
         and __supplied_ca is string and __supplied_ca | length > 0 }}
  vars:
    __supplied_token: "{{ prometheus_kubernetes_credentials.token | default('') }}"
    __supplied_ca: "{{ prometheus_kubernetes_credentials.ca_cert | default('') }}"
  no_log: true

- name: Inspect the installed discovery token
  ansible.builtin.stat:
    path: /app/prometheus/conf/kubernetes-token
  register: __prometheus_k8s_token_file

- name: Inspect the installed Kubernetes API CA
  ansible.builtin.stat:
    path: /app/prometheus/conf/kubernetes-ca.crt
  register: __prometheus_k8s_ca_file

# This is a local file sanity check, not an authentication or certificate test.
- name: Determine whether a complete credential pair is already installed
  ansible.builtin.set_fact:
    __prometheus_kubernetes_installed_credentials: >-
      {{ (__prometheus_k8s_token_file.stat.isreg | default(false) | bool)
         and (__prometheus_k8s_token_file.stat.size | default(0) | int > 0)
         and (__prometheus_k8s_ca_file.stat.isreg | default(false) | bool)
         and (__prometheus_k8s_ca_file.stat.size | default(0) | int > 0) }}

- name: Select Kubernetes monitoring availability for this host
  ansible.builtin.set_fact:
    __prometheus_kubernetes_enabled: >-
      {{ (prometheus_kubernetes_monitoring_enabled | bool)
         and ((__prometheus_kubernetes_fresh_credentials | bool)
              or (__prometheus_kubernetes_installed_credentials | bool)) }}

- name: Validate enabled Kubernetes scrape settings
  ansible.builtin.assert:
    that:
      - prometheus_kubernetes_api_server is match('^https://')
    fail_msg: Configure an internal TLS Kubernetes API endpoint for discovery.
  when: __prometheus_kubernetes_enabled | bool

- name: Install the caller's complete credential snapshot
  ansible.builtin.copy:
    content: "{{ prometheus_kubernetes_credentials[item.key] }}"
    dest: "/app/prometheus/conf/{{ item.filename }}"
    owner: root
    group: nogroup
    mode: "0640"
  loop:
    - {key: token, filename: kubernetes-token}
    - {key: ca_cert, filename: kubernetes-ca.crt}
  when:
    - __prometheus_kubernetes_enabled | bool
    - __prometheus_kubernetes_fresh_credentials | bool
  no_log: true
  notify: Restart Prometheus service

- name: Report cluster monitoring deferred on initial setup
  ansible.builtin.debug:
    msg: Kubernetes monitoring is deferred until credentials are available. Host and application monitoring continue normally.
  when:
    - prometheus_kubernetes_monitoring_enabled | bool
    - not (__prometheus_kubernetes_enabled | bool)

- name: Report reuse of installed credentials during Kubernetes unavailability
  ansible.builtin.debug:
    msg: No fresh Kubernetes credentials were supplied; keeping existing credentials, cluster scrapes and alerts active.
  when:
    - __prometheus_kubernetes_enabled | bool
    - not (__prometheus_kubernetes_fresh_credentials | bool)
