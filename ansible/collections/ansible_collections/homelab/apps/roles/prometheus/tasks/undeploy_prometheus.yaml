---
- name: Stop and disable monitoring services on disabled hosts
  when: not (deploy_prometheus | default(false) | bool)
  block:
    - name: Inspect existing monitoring units
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ item }}.service"
      loop: [prometheus, alertmanager]
      register: __prometheus_units

    - name: Stop and disable installed monitoring units
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.service"
        state: stopped
        enabled: false
      loop: "{{ __prometheus_units.results }}"
      when: item.stat.exists

    - name: Remove obsolete monitoring unit files
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.service"
        state: absent
      loop: [prometheus, alertmanager]
      notify: Reload systemd daemons

