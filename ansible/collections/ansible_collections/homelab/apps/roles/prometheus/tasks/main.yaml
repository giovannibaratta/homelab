---
- name: Determine Prometheus lifecycle
  ansible.builtin.set_fact:
    # Evaluate inventory-wide intent so disabled hosts cannot delete shared resources.
    __prometheus_k8s_hosts: >-
      {%- set ns = namespace(hosts=[]) -%}
      {%- for host in groups['all'] -%}
      {%- if (hostvars[host].deploy_prometheus | default(false) | bool) -%}
      {%- set ns.hosts = ns.hosts + [host] -%}
      {%- endif -%}
      {%- endfor -%}
      {{ ns.hosts }}

- name: Deploy monitoring services
  ansible.builtin.import_tasks: deploy_prometheus.yaml

- name: Undeploy disabled monitoring services
  ansible.builtin.import_tasks: undeploy_prometheus.yaml
