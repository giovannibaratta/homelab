---
- name: Coder | Determine whether the Kubernetes backend is enabled
  ansible.builtin.set_fact:
    __k8s_coder_enabled: "{{ (deploy_coder | default(false) | bool) and coder_deployment_type == 'k8s' }}"
  tags: always

- name: Coder | Deploy Kubernetes resources
  ansible.builtin.import_tasks: deploy_coder.yaml
  when: __k8s_coder_enabled | bool
