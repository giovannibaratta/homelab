- id: '1768822000004'
  alias: Sungrow - High House Power Usage Alert
  description: 'Notify via Telegram if house consumption exceeds 4500W for 2 minutes (with 30m debounce)'
  triggers:
    - trigger: numeric_state
      entity_id: sensor.sungrow_live_house_load_power
      above: 3000
      for:
        minutes: 2
  conditions:
    - condition: template
      value_template: >-
        {{ state_attr('automation.sungrow_high_house_power_usage_alert', 'last_triggered') is none or (now() - state_attr('automation.sungrow_high_house_power_usage_alert', 'last_triggered')).total_seconds() > 1800 }}
  actions:
    - action: telegram_bot.send_message
      metadata: {}
      data:
        config_entry_id: 01K0EH39E2K0KR0C66KNV4HHQG
        parse_mode: html
        message: >-
          ⚠️ <b>Attenzione Spegni le luci, questa non è una centrale nucleare!</b>
          La potenza assorbita dalla casa è di <b>{{ (states('sensor.sungrow_live_house_load_power') | float(0) / 1000) | round(2) }} kW</b>.
          Produzione solare attuale: <b>{{ (states('sensor.sungrow_live_solar_pv_power') | float(0) / 1000) | round(2) }} kW</b>.
  mode: single