- id: "1752841190486"
  alias: SendNotificationIfMovement
  description: Send a notification to Telegram if a movement is detected
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.yi_camera_movement
      from: "off"
      to: "on"
  conditions:
    - condition: and
      conditions:
        - condition: state
          entity_id: person.loredana
          state: not_home
        - condition: state
          entity_id: person.antonio
          state: not_home
  actions:
    - sequence:
        - variables:
            random_value:
              "{{ now().strftime('%Y-%m-%d_%H-%M-%S') }}-{{ range(1, 100000)
              | random }}"
        - action: camera.record
          metadata: {}
          data:
            filename: /tmp/movement_detected{{random_value}}.mp4
            duration: 15
          target:
            entity_id:
              - camera.tapo_c230_ce52_live_view
        - action: telegram_bot.send_video
          metadata: {}
          data:
            authentication: digest
            config_entry_id: 01K0EH39E2K0KR0C66KNV4HHQG
            file: /tmp/movement_detected{{random_value}}.mp4
            disable_notification: true
  mode: single
- id: "1756649357117"
  alias: EnergyProductionDaily
  description: "Daily solar production and self-consumption summary report at 20:00"
  triggers:
    - trigger: time
      at: "20:00:00"
  conditions: []
  actions:
    - action: telegram_bot.send_message
      metadata: {}
      data:
        config_entry_id: 01K0EH39E2K0KR0C66KNV4HHQG
        parse_mode: html
        title: ☀️ <b>Riepilogo Solare Giornaliero</b>
        message: >-
          {% set prod = states('sensor.sungrow_daily_solar_production') | float(0) %}
          {% set export = states('sensor.sungrow_daily_grid_export') | float(0) %}
          {% set self_cons = ([prod - export, 0.0] | max) | round(2) %}
          {% set pct = ((self_cons / ([prod, 0.1] | max)) * 100) | round(1) %}
          📊 <b>Dati Solari di Oggi:</b>
          • Produzione Totale: <b>{{ prod }} kWh</b>
          • Autoconsumo: <b>{{ self_cons }} kWh</b> ({{ pct }}%)
          • Immessa in Rete: <b>{{ export }} kWh</b>
  mode: single
