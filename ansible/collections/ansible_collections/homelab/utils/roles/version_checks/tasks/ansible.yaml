---
- name: Verify Ansible version
  ansible.builtin.assert:
    that:
      - ansible_version.full is version('2.19', '>=')
      - ansible_version.full is version('2.20', '<')
    fail_msg: "This playbook requires ansible-core >=2.19 and <2.20. Found: {{ ansible_version.full }}"
    success_msg: "Ansible version {{ ansible_version.full }} is supported."
  tags: always
