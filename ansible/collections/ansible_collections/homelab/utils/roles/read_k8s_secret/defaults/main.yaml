---
k8s_secret_reader_enabled: false
k8s_secret_reader_host: "{{ inventory_hostname }}"
k8s_secret_reader_kubeconfig: /etc/kubernetes/admin.conf
# Bound each complete module attempt, including API discovery/connection setup.
k8s_secret_reader_timeout: 10
k8s_secret_reader_required_keys: [token, ca.crt]

