---
shared_state: false
ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --inventory=${MOLECULE_PROJECT_DIRECTORY}/inventory/hosts.yml
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../collections:~/.ansible/collections:/usr/share/ansible/collections
    ANSIBLE_LOCAL_TEMP: ${MOLECULE_PROJECT_DIRECTORY}/../../.ansible/vm-lab/tmp
  cfg:
    defaults:
      fact_caching: memory
  playbooks:
    create: create.yml
    converge: converge.yml
    verify: verify.yml
    destroy: destroy.yml
scenario:
  # TODO: Make the network role's unconditional commands report changes accurately,
  # then add Molecule's idempotence step after converge.
  test_sequence: [destroy, create, converge, verify, destroy]
verifier:
  name: ansible
