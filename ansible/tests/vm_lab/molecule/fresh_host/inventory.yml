---
# The guest address exists only on this scenario's private socket network.
# Shared role configuration/peer discovery still comes from home.yaml.
home:
  hosts:
    fresh-host:
      ansible_host: target
      ansible_user: ansible
      ansible_ssh_common_args: >-
        -F "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/../../.ansible/vm-lab/fresh_host/ssh_config"
      ansible_ssh_args: -o ControlMaster=no
      internal_interface: eth0
      internal_ip: 172.16.199.10
      internal_gateway: 172.16.255.254
      internal_network_netmask_length: 16
      fresh_host_dns_servers: [172.16.255.252, 172.16.255.253]
      network_k8s_ip: 172.20.0.4
      network_is_router: false
      network_ssh_allowed_sources: [172.16.0.0/16]
      k8s_node_bootstrapped: false
      auto_ansible_enabled: false
      system_update_day: never
      linstor_node_enabled: true
      linstor_use_loopback: true
      linstor_backing_file_size_mb: 10240
      # Exercise host setup without enabling shared applications on the guest.
      deploy_adguard: false
      deploy_coder: false
      deploy_crowdsec: false
      deploy_sungrow_exporter: false
      deploy_forgejo: false
      deploy_headlamp: false
      deploy_cloudflare_tunnel: false
      deploy_nut: false
      vpn_deploy_exit_node: false
      vpn_deploy_jump_node: false
      vpn_deploy_management_server: false
      vpn_deploy_dashboard: false
      vpn_deploy_stun_server: false
      vpn_deploy_client: false
      vpn_deploy_relay_server: false

# Load the same node-network variables as a worker without joining a cluster.
kube_node:
  hosts:
    fresh-host:
