all:
  vars:
    lab_state: "{{ inventory_dir }}/../../../.ansible/vm-lab"
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_common_args: '-F "{{ lab_state }}/ssh_config"'
  hosts:
    gateway:
    target:
      # No production inventory or credentials are loaded by this scenario.
      install_terraform: false
      base_ohmyzsh_install: true
      base_ohmyzsh_users: [root, ansible]
      system_update_day: never
      network_is_router: false
      network_ssh_allowed_sources: [172.16.255.252, 172.16.255.253]
      bridge_name: br0
      internal_interface: eth0
      internal_ip: 172.16.0.10
      internal_ip_address: 172.16.0.10
      internal_gateway: 172.16.255.254
      internal_network: 172.16.0.0
      internal_network_netmask_length: 16
      network_gateway_virtual_ip: 172.16.255.254
      network_k8s_ip: 172.20.0.10
      k8s_cp_network: 172.20.0.0
      k8s_cp_netmask: 16
      k8s_lb_network: 172.21.0.0/16
      kube_service_addresses: 10.233.0.0/18
